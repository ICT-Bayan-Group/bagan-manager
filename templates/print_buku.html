<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Buku Turnamen - Balikpapan Open</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root { --primary: #000; --line: #ccc; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: #fff; }

        /* Pengaturan Cetak Halaman */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            .no-print { display: none; }
            .page-break { page-break-after: always; }
        }

        .book-page { padding: 20px; position: relative; min-height: 100vh; box-sizing: border-box; }
        .header-title { text-align: center; border-bottom: 3px solid #000; margin-bottom: 20px; padding-bottom: 10px; }
        .header-title h1 { margin: 0; text-transform: uppercase; font-size: 28px; }

        /* Gaya Tabel Jadwal */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }

        /* Gaya Bagan (Symmetrical) */
        .bracket-flex { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; scale: 0.8; transform-origin: top center; }
        .side { display: flex; gap: 20px; }
        .round { display: flex; flex-direction: column; width: 140px; }
        .match-card { border: 1px solid #000; margin: 5px 0; font-size: 10px; background: #fff; }
        .p-name { padding: 4px; border-bottom: 1px solid #eee; font-weight: bold; }
        
        .floating-btn { position: fixed; bottom: 20px; right: 20px; padding: 15px 30px; background: #1e3a8a; color: white; border-radius: 50px; cursor: pointer; font-weight: bold; border: none; }
    </style>
</head>
<body>

<button class="floating-btn no-print" onclick="window.print()">
    <i class="fas fa-print"></i> CETAK MENJADI BUKU (PDF)
</button>

<div id="master-content">
    <div class="book-page page-break">
        <div class="header-title">
            <h1>JADWAL PERTANDINGAN UTAMA</h1>
            <p>Balikpapan Open 2026</p>
        </div>
        <div id="schedule-area">Memuat data jadwal...</div>
    </div>

    <div id="brackets-area"></div>
</div>

<script>
    <script>
    async function loadAllData() {
        try {
            // 1. Muat Jadwal
            const resSch = await fetch('/get-schedule');
            const schedules = await resSch.json();
            renderSchedule(schedules);

            // 2. Muat Semua Bagan
            const resMat = await fetch('/get-matches');
            const allMatches = await resMat.json();
            
            // Ambil kategori unik & bersihkan dari nilai kosong
            const categories = [...new Set(allMatches.map(m => m.kategori))].filter(c => c);
            
            renderAllBrackets(allMatches, categories);
        } catch (error) {
            console.error("Gagal memuat data:", error);
            alert("Gagal memuat data. Pastikan server app.py sedang berjalan.");
        }
    }

    function renderSchedule(data) {
        let area = document.getElementById('schedule-area');
        if (!data || data.length === 0) {
            area.innerHTML = "<p>Tidak ada jadwal pertandingan.</p>";
            return;
        }
        let html = `<table><thead><tr><th>Jam</th><th>Lap</th><th>Kategori</th><th>Pertandingan</th><th>Babak</th></tr></thead><tbody>`;
        data.forEach(m => {
            html += `<tr><td>${m.jam}</td><td>${m.court}</td><td>${m.kategori}</td><td>${m.partai}</td><td>${m.babak}</td></tr>`;
        });
        html += `</tbody></table>`;
        area.innerHTML = html;
    }

    function renderAllBrackets(allMatches, categories) {
        const area = document.getElementById('brackets-area');
        area.innerHTML = ""; // Bersihkan area
        const rounds = ["R512", "R256", "R128", "R64", "R32", "R16", "R8", "SEMIFINAL"];

        categories.forEach(cat => {
            let catData = allMatches.filter(m => m.kategori === cat);
            let safeId = cat.replace(/\s+/g, '-'); // Ganti spasi dengan tanda minus agar ID aman

            let section = document.createElement('div');
            section.className = "book-page page-break";
            section.innerHTML = `
                <div class="header-title">
                    <h1>BAGAN PERTANDINGAN: ${cat}</h1>
                </div>
                <div class="bracket-flex">
                    <div class="side left" id="left-${safeId}"></div>
                    <div class="final-area" id="final-${safeId}"></div>
                    <div class="side right" id="right-${safeId}"></div>
                </div>
            `;
            area.appendChild(section);

            // Render Final di Tengah
            const finalMatch = catData.find(m => m.babak === "FINAL");
            if(finalMatch) {
                document.getElementById(`final-${safeId}`).innerHTML = `
                    <div style="border:2px solid #000; padding:10px; text-align:center;">
                        <strong>FINAL</strong><br>${finalMatch.p1} vs ${finalMatch.p2}
                    </div>`;
            }

            // Render Babak lainnya
            rounds.forEach(r => {
                const roundMatches = catData.filter(m => m.babak === r);
                if(roundMatches.length > 0) {
                    const mid = Math.ceil(roundMatches.length / 2);
                    document.getElementById(`left-${safeId}`).appendChild(createRoundDiv(roundMatches.slice(0, mid), r));
                    document.getElementById(`right-${safeId}`).appendChild(createRoundDiv(roundMatches.slice(mid), r));
                }
            });
        });
    }

    function createRoundDiv(matches, name) {
        const div = document.createElement('div');
        div.className = 'round';
        div.innerHTML = `<div style="text-align:center; font-weight:bold; font-size:9px; border-bottom:1px solid #000; margin-bottom:5px;">${name}</div>`;
        matches.forEach(m => {
            div.innerHTML += `
                <div class="match-card">
                    <div class="p-name">${m.p1}</div>
                    <div class="p-name">${m.p2}</div>
                </div>`;
        });
        return div;
    }

    loadAllData();
</script>
</script>
</body>
</html>
