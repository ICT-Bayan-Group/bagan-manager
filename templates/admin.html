<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Command Center - Balikpapan Open</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --sidebar-bg: #ffffff;
            /* Menggunakan dvh (Dynamic Viewport Height) agar pas di HP walau ada bar navigasi browser */
            --full-height: 100dvh;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            height: var(--full-height);
            width: 100vw;
            overflow: hidden;
        }

        /* --- SIDEBAR (Mobile-First) --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: -280px;
            /* Sembunyi secara default */
            top: 0;
            bottom: 0;
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        .sidebar.open {
            transform: translateX(280px);
        }

        .sidebar h2 {
            color: var(--primary);
            font-size: 1.2rem;
            margin: 10px 0 30px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-label {
            font-size: 0.7rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            margin: 20px 0 10px 10px;
            letter-spacing: 0.05em;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            /* Lebih besar untuk sentuhan jari */
            border-radius: 10px;
            color: #475569;
            text-decoration: none;
            margin-bottom: 6px;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
        }

        .nav-item:active,
        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        /* --- MAIN AREA --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .top-bar {
            background: white;
            padding: 0 16px;
            height: 60px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .menu-toggle {
            background: #f1f5f9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            color: var(--primary);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #page-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .workspace {
            flex: 1;
            background: #f1f5f9;
            position: relative;
            overflow: hidden;
        }

        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            /* Memperbaiki scrolling di iOS */
            -webkit-overflow-scrolling: touch;
        }

        /* --- OVERLAY --- */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(2px);
            z-index: 1500;
        }

        .overlay.active {
            display: block;
        }

        /* --- DESKTOP VIEW --- */
        @media (min-width: 992px) {
            .sidebar {
                position: relative;
                left: 0;
                transform: none;
            }

            .menu-toggle {
                display: none;
            }

            .overlay {
                display: none !important;
            }

            #page-title {
                max-width: none;
                font-size: 1.2rem;
            }

            .top-bar {
                padding: 0 30px;
                height: 70px;
            }
        }

        /* --- LOADER --- */
        #loader {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <h2><i class="fas fa-shuttlecock"></i> BAYAN OPEN</h2>
        <nav style="overflow-y: auto; flex: 1; margin: 0 -10px; padding: 0 10px;">
            <div class="nav-label">Main</div>
            <button class="nav-item active" onclick="loadPage('/stats')">
                <i class="fas fa-chart-line"></i> Ringkasan
            </button>

            <div class="nav-label">Setup</div>
            <button class="nav-item" onclick="loadPage('/manage-categories')">
                <i class="fas fa-tags"></i> Kategori
            </button>
            <button class="nav-item" onclick="loadPage('/pendaftaran')">
                <i class="fas fa-user-plus"></i> Peserta
            </button>

            <div class="nav-label">Engine</div>
            <button class="nav-item" onclick="loadPage('/jadwal')">
                <i class="fas fa-calendar-alt"></i> Atur Jadwal
            </button>
            <button class="nav-item" onclick="executeScript('/run-schedule')">
                <i class="fas fa-clock"></i> Generate
            </button>

            <div class="nav-label">Monitoring</div>
           

            <button class="nav-item" onclick="loadPage('/lihat-jadwal')">
                <i class="fas fa-calendar-alt"></i> Lihat Jadwal
            </button>

            <button class="nav-item" onclick="loadPage('/lihat-bagan')">
                <i class="fas fa-calendar-alt"></i> Lihat Bagan
            </button>
            <button class="nav-item" onclick="loadPage('/skor-pertandingan')">
                <i class="fas fa-poll"></i> Hasil & Skor
            </button>

            <div class="nav-label" style="color: #ef4444;">System</div>
            <button class="nav-item" onclick="executeReset()" style="color: #ef4444;">
                <i class="fas fa-trash-alt"></i> Reset
            </button>
        </nav>
    </aside>

    <main class="main-container">
        <header class="top-bar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="menu-toggle" onclick="toggleMenu()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="page-title">Ringkasan Event</h1>
            </div>
            <div
                style="font-size: 10px; color: #10b981; font-weight: bold; background: #ecfdf5; padding: 4px 8px; border-radius: 6px;">
                <i class="fas fa-circle" style="font-size: 6px;"></i> ONLINE
            </div>
        </header>

        <section class="workspace">
            <div id="loader">
                <div class="spinner"></div>
                <p style="margin-top:10px; font-size:11px; font-weight:700; color:var(--primary)">Processing...</p>
            </div>
            <iframe id="content-frame" src="/stats" name="content-frame"></iframe>
        </section>
    </main>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function loadPage(url) {
            const frame = document.getElementById('content-frame');
            const title = document.getElementById('page-title');

            // Tampilkan loader saat ganti halaman
            document.getElementById('loader').style.display = 'flex';
            frame.src = url;

            // Mapping Judul
            const titles = {
                '/stats': 'Ringkasan Event',
                '/manage-categories': 'Manajemen Kategori',
                '/pendaftaran': 'Input Peserta',
                '/jadwal': 'Atur Slot Jadwal',
                '/skor-pertandingan': 'Hasil & Skor',
                '/lihat-bagan': 'Bagan Pertandingan',
                '/lihat-jadwal': 'Jadwal Pertandingan'
            };
            title.innerText = titles[url] || 'Bayan Open';

            // Menu Aktif
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(url)) {
                    btn.classList.add('active');
                }
            });

            // Sembunyikan loader setelah iframe load
            frame.onload = () => {
                document.getElementById('loader').style.display = 'none';
            };

            // Tutup menu di mobile setelah klik
            if (window.innerWidth < 992) {
                toggleMenu();
            }
        }

        async function executeScript(endpoint) {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            try {
                const res = await fetch(endpoint, { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                document.getElementById('content-frame').contentWindow.location.reload();
            } catch (err) {
                alert("Koneksi gagal.");
            } finally {
                loader.style.display = 'none';
            }
        }

        async function executeReset() {
            const pwd = prompt("Password Admin:");
            if (!pwd) return;
            if (confirm("Hapus SEMUA data?")) {
                const loader = document.getElementById('loader');
                loader.style.display = 'flex';
                try {
                    const res = await fetch('/reset-all', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pwd })
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (res.ok) loadPage('/stats');
                } catch (err) { alert("Error."); }
                finally { loader.style.display = 'none'; }
            }
        }
    </script>
</body>

</html>
