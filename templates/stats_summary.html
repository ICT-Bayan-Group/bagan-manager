<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Statistik - BPN OPEN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --bg: #f8fafc;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            padding: 15px; /* Padding lebih kecil untuk HP */
            margin: 0; 
            color: #1e293b;
        }

        /* Stats Cards - 1 Kolom di HP, 3 Kolom di Desktop */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; /* Default HP: 1 Baris 1 Kartu */
            gap: 15px; 
            margin-bottom: 25px; 
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); 
            border-left: 5px solid var(--primary); /* Pindah ke samping agar lebih cantik di HP */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card h3 { 
            margin: 0; 
            font-size: 11px; 
            color: #64748b; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .card p { 
            margin: 8px 0 0; 
            font-size: 32px; 
            font-weight: 800; 
            color: var(--primary); 
        }

        /* Container Detail */
        .detail-section { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); 
        }

        .detail-section h2 { 
            margin-top: 0; 
            font-size: 16px; 
            color: var(--primary); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        /* --- MAGIC TABLE: Berubah jadi List di HP --- */
        table { width: 100%; border-collapse: collapse; }
        
        /* Desktop Style */
        th { text-align: left; padding: 12px; color: #64748b; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

        @media (max-width: 600px) {
            /* Sembunyikan Header Tabel di HP */
            thead { display: none; }
            
            /* Buat baris tabel jadi seperti kartu */
            tr { 
                display: block; 
                margin-bottom: 10px; 
                border: 1px solid #f1f5f9;
                border-radius: 10px;
                padding: 10px;
            }

            td { 
                display: flex; 
                justify-content: space-between; 
                align-items: center;
                border: none;
                padding: 8px 5px;
                text-align: right;
            }

            /* Tambahkan Label Manual di depan data */
            td::before {
                content: attr(data-label); /* Mengambil teks dari atribut data-label */
                font-weight: 700;
                color: #64748b;
                font-size: 12px;
                text-align: left;
            }
            
            .badge-count { width: auto; }
        }

        /* Tablet & Desktop */
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            body { padding: 30px; }
            .card { border-left: none; border-top: 4px solid var(--primary); }
        }

        .badge-count { 
            background: #eff6ff; 
            color: #1e40af; 
            padding: 6px 12px; 
            border-radius: 10px; 
            font-weight: 800; 
            font-size: 13px; 
            border: 1px solid #dbeafe;
        }
    </style>
</head>
<body>

    <div class="grid">
        <div class="card">
            <h3>Kategori</h3>
            <p id="stat-cat">0</p>
        </div>
        <div class="card" style="border-color: #3b82f6;">
            <h3>Pertandingan</h3>
            <p id="stat-match">0</p>
        </div>
        <div class="card" style="border-color: #10b981;">
            <h3>Jadwal</h3>
            <p id="stat-sched">0</p>
        </div>
    </div>

    <div class="detail-section">
        <h2><i class="fas fa-users"></i> Peserta per Kategori</h2>
        <table>
            <thead>
                <tr>
                    <th>Nama Kategori</th>
                    <th style="text-align: center;">Jumlah Peserta</th>
                </tr>
            </thead>
            <tbody id="category-details">
                </tbody>
        </table>
    </div>

    <script>
        async function loadAllStats() {
            try {
                // Load data dasar
                const [resCat, resMatch, resSched] = await Promise.all([
                    fetch('/get-categories'),
                    fetch('/get-matches'),
                    fetch('/get-schedule')
                ]);

                const dataCat = await resCat.json();
                const dataMatch = await resMatch.json();
                const dataSched = await resSched.json();

                document.getElementById('stat-cat').innerText = dataCat.categories ? dataCat.categories.length : 0;
                document.getElementById('stat-match').innerText = dataMatch.length || 0;
                document.getElementById('stat-sched').innerText = dataSched.length || 0;

                // Load detail kategori
                const resStats = await fetch('/get-category-stats');
                const dataStats = await resStats.json();
                
                const tableBody = document.getElementById('category-details');
                tableBody.innerHTML = '';

                dataStats.forEach(item => {
                    const row = `
                        <tr>
                            <td data-label="KATEGORI"><strong>${item.name}</strong></td>
                            <td data-label="PESERTA" style="text-align: center;">
                                <span class="badge-count">${item.count} Tim</span>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

            } catch (e) {
                console.error("Gagal memuat statistik:", e);
            }
        }

        loadAllStats();
    </script>
</body>
</html>
