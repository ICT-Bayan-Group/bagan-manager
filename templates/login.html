<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Balikpapan Open Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --bg: #f1f5f9;
            --text-main: #1e293b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, #e2e8f0 1px, transparent 0);
            background-size: 40px 40px; /* Pola titik halus di background */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .logo-area {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h2 {
            color: var(--text-main);
            font-weight: 800;
            margin: 0 0 8px 0;
            font-size: 1.5rem;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: 0.2s;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        input:focus + i {
            color: var(--accent);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        button:hover {
            background: #152a61;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        #error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 20px;
            display: none; /* Sembunyi jika tidak ada error */
            border: 1px solid #fee2e2;
        }

        /* Footer Copyright */
        .footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Animasi Loading pada Tombol */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <i class="fas fa-shuttlecock"></i>
        </div>
        <h2>BPN OPEN</h2>
        <p class="subtitle">Silakan login ke Command Center</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="Username" required>
            <i class="fas fa-user"></i>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
            <i class="fas fa-lock"></i>
        </div>

        <button onclick="login()" id="login-btn">
            <span id="btn-text">Masuk Sekarang</span>
            <div class="spinner" id="btn-spinner"></div>
        </button>

        <p id="error-msg"></p>

        <div class="footer">
            &copy; 2026 Balikpapan Open Tournament
        </div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorElement = document.getElementById('error-msg');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const loginBtn = document.getElementById('login-btn');

            if (!user || !pass) {
                showError("Username dan password wajib diisi!");
                return;
            }

            // Loading State
            loginBtn.disabled = true;
            btnText.innerText = "Memproses...";
            btnSpinner.style.display = "block";
            errorElement.style.display = "none";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (res.ok) {
                    window.location.href = '/admin'; 
                } else {
                    const data = await res.json();
                    showError(data.message || "Login gagal!");
                }
            } catch (err) {
                showError("Gagal terhubung ke server.");
            } finally {
                loginBtn.disabled = false;
                btnText.innerText = "Masuk Sekarang";
                btnSpinner.style.display = "none";
            }
        }

        function showError(msg) {
            const errorElement = document.getElementById('error-msg');
            errorElement.innerText = msg;
            errorElement.style.display = "block";
        }

        // Jalankan login saat tekan tombol "Enter" di keyboard
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
