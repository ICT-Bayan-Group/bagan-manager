<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Balikpapan Open Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --bg: #f8fafc; /* Warna background lebih bersih */
            --text-main: #1e293b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            /* Pola titik tetap dipertahankan agar tidak terlalu polos */
            background-image: radial-gradient(circle at 2px 2px, #e2e8f0 1px, transparent 0);
            background-size: 40px 40px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            padding: 20px;
        }

        .login-card {
            background: transparent; /* KOTAK DIHAPUS */
            width: 100%;
            max-width: 360px; /* Sedikit lebih ramping */
            padding: 20px;
            box-shadow: none; /* BAYANGAN DIHAPUS */
            text-align: center;
        }

        .logo-area {
            color: var(--primary);
            font-size: 3rem;
            margin-bottom: 15px;
            /* Memberikan sedikit efek glow pada logo karena tidak ada kotak */
            text-shadow: 0 0 20px rgba(30, 58, 138, 0.1);
        }

        h2 {
            color: var(--text-main);
            font-weight: 800;
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 35px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: 0.2s;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: white; /* Input tetap putih agar kontras */
            border: 1.5px solid #e2e8f0;
            border-radius: 16px; /* Lebih bulat/rounded */
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
        }

        button:hover {
            background: #152a61;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.3);
        }

        #error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 20px;
            display: none;
            border: 1px solid #fecaca;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <i class="fas fa-shuttlecock"></i>
        </div>
        <h2>BAYAN OPEN</h2>
        <p class="subtitle">Command Center Login</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="Username" required autocomplete="off">
            <i class="fas fa-user"></i>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
            <i class="fas fa-lock"></i>
        </div>

        <button onclick="login()" id="login-btn">
            <span id="btn-text">Masuk</span>
            <div class="spinner" id="btn-spinner" style="display:none; width:18px; height:18px; border:2px solid rgba(255,255,255,.3); border-top:2px solid white; border-radius:50%; animation:spin .8s linear infinite;"></div>
        </button>

        <p id="error-msg"></p>

        <div class="footer">
            &copy; 2026 Balikpapan Open
        </div>
    </div>

    <script>
        // Animasi spin tetap diperlukan di CSS/JS
        const style = document.createElement('style');
        style.innerHTML = '@keyframes spin { 100% { transform: rotate(360deg); } }';
        document.head.appendChild(style);

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorElement = document.getElementById('error-msg');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const loginBtn = document.getElementById('login-btn');

            if (!user || !pass) {
                showError("Isi username & password!");
                return;
            }

            loginBtn.disabled = true;
            btnText.innerText = "Memverifikasi...";
            btnSpinner.style.display = "block";
            errorElement.style.display = "none";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (res.ok) {
                    window.location.href = '/admin'; 
                } else {
                    const data = await res.json();
                    showError(data.message || "Akses ditolak!");
                }
            } catch (err) {
                showError("Server tidak merespon.");
            } finally {
                loginBtn.disabled = false;
                btnText.innerText = "Masuk";
                btnSpinner.style.display = "none";
            }
        }

        function showError(msg) {
            const errorElement = document.getElementById('error-msg');
            errorElement.innerText = msg;
            errorElement.style.display = "block";
        }

        document.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
