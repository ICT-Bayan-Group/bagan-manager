<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jadwal - Balikpapan Open</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #f59e0b;
            --bg: #f1f5f9;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px;
        }

        /* Search & Filter Section */
        .search-container {
            background: var(--white);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
        }

        .filter-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-box input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .cat-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-top: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .cat-filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            white-space: nowrap;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .date-display {
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
            padding: 10px;
            background: #dbeafe;
            border-radius: 10px;
        }

        .schedule-table { width: 100%; border-collapse: collapse; }
        thead { display: none; }

        .time-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 25px;
        }

        .time-cell {
            background: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-cell strong { font-size: 16px; }
        .time-cell span { font-size: 11px; opacity: 0.8; }

        .match-cell {
            background: white;
            padding: 12px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .match-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* Match Card */
        .match-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 15px;
            border-left: 5px solid var(--accent);
            position: relative;
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .kat-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .match-number-box {
            background: #1e40af;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-weight: 900;
        }

        .players {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin: 12px 0;
            line-height: 1.4;
        }

        .vs-text {
            color: #94a3b8;
            font-size: 11px;
            margin: 4px 0;
            display: block;
            font-weight: normal;
        }

        /* Footer Kartu untuk Venue & Lapangan */
        .match-footer {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 12px;
            margin-top: 5px;
        }

        .venue-info {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-weight: 700;
        }

        .court-info {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            font-weight: 700;
        }

        .babak-label {
            align-self: flex-end;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            color: #475569;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 10px;
        }

        /* DESKTOP VIEW */
        @media (min-width: 768px) {
            .container { padding: 20px; }
            .filter-row { flex-direction: row; }
            .date-display { font-size: 24px; background: transparent; }
            thead { display: table-header-group; }
            .time-row { display: table-row; }
            .time-cell { 
                display: table-cell; 
                border-radius: 12px 0 0 12px; 
                width: 120px; 
                border-left: 5px solid var(--primary);
                vertical-align: top;
                padding: 25px;
            }
            .match-cell { display: table-cell; border-radius: 0 12px 12px 0; }
            .match-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
            .match-footer { flex-direction: row; justify-content: space-between; align-items: center; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="search-container">
            <div class="filter-row">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari Nama Pemain atau No..." onkeyup="filterJadwal()">
                </div>
                <div style="display: flex; gap: 10px;">
                    <select id="dateSelect" onchange="loadJadwal()" style="flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-weight: bold; background: #fff;"></select>
                    <button onclick="window.print()" style="padding: 12px; background: #e2e8f0; border: none; border-radius: 12px; cursor: pointer; color: var(--primary);"><i class="fas fa-print"></i></button>
                </div>
            </div>
            <div class="cat-filters" id="catFilters">
                <button class="filter-btn active" onclick="setKategori('ALL', this)">SEMUA KATEGORI</button>
            </div>
        </div>

        <div id="dateDisplay" class="date-display">MEMUAT JADWAL...</div>

        <table class="schedule-table">
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <script>
        let allData = [];
        let currentKategori = 'ALL';

        async function init() {
            try {
                const res = await fetch('/get-schedule');
                allData = await res.json();

                if (allData.length === 0) {
                    document.getElementById('dateDisplay').innerText = "DATA KOSONG";
                    return;
                }

                const dates = [...new Set(allData.map(d => d.tanggal))].sort();
                const ds = document.getElementById('dateSelect');
                dates.forEach(d => ds.add(new Option("📅 " + d, d)));

                const cats = [...new Set(allData.map(d => d.kategori))];
                const catCont = document.getElementById('catFilters');
                cats.forEach(c => {
                    if (c) {
                        const btn = document.createElement('button');
                        btn.className = 'filter-btn';
                        btn.innerText = c;
                        btn.onclick = function () { setKategori(c, this); };
                        catCont.appendChild(btn);
                    }
                });

                loadJadwal();
            } catch (e) { console.error("Gagal load data:", e); }
        }

        function setKategori(kat, btn) {
            currentKategori = kat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadJadwal();
        }

        function loadJadwal() {
            const dateRaw = document.getElementById('dateSelect').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const body = document.getElementById('scheduleBody');
            body.innerHTML = '';

            const dateObj = new Date(dateRaw);
            const formattedDate = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('dateDisplay').innerHTML = `<i class="fas fa-calendar-check"></i> ${formattedDate}`;

            let filtered = allData.filter(d => d.tanggal === dateRaw);
            if (currentKategori !== 'ALL') filtered = filtered.filter(d => d.kategori === currentKategori);
            if (search) {
                filtered = filtered.filter(d => 
                    d.partai.toLowerCase().includes(search) || d.match_id.toString() === search
                );
            }

            const times = [...new Set(filtered.map(d => d.jam))].sort();

            times.forEach(t => {
                const matches = filtered.filter(m => m.jam === t);
                let rowHtml = `
                    <tr class="time-row">
                        <td class="time-cell">
                            <strong>${t.substring(0, 5)}</strong>
                            <span>WITA</span>
                        </td>
                        <td class="match-cell">
                            <div class="match-grid">`;

                matches.forEach(m => {
                    let pemain = m.partai.replace(' vs ', '<span class="vs-text">VS</span>');
                    let venueName = m.venue ? m.venue : "Lokasi Belum Ditentukan";

                    rowHtml += `
                        <div class="match-card">
                            <div class="match-top">
                                <span class="kat-badge">${m.kategori}</span>
                                <span style="font-size:10px; font-weight:bold;">No Pertandingan <span class="match-number-box">${m.match_id}</span></span>
                            </div>
                            <div class="players">${pemain}</div>
                            <div class="match-footer">
                                <div style="display: flex; flex-direction: column; gap: 4px;">
                                    <div class="venue-info">
                                        <i class="fas fa-building"></i> ${venueName}
                                    </div>
                                    <div class="court-info">
                                        <i class="fas fa-map-marker-alt"></i> Lapangan ${m.court}
                                    </div>
                                </div>
                                <span class="babak-label">${m.babak}</span>
                            </div>
                        </div>`;
                });

                rowHtml += `</div></td></tr>`;
                body.innerHTML += rowHtml;
            });
        }

        function filterJadwal() { loadJadwal(); }
        init();
    </script>
</body>

</html>
