<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Score - Balikpapan Open</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 16px;
            color: #1e293b;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* HEADER & FILTER */
        .header-section { margin-bottom: 24px; }
        
        h2 {
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 20px 0;
            font-size: 1.5rem;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #fff;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .filter-item label {
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            background: #f8fafc;
        }

        /* CARD STYLE (MOBILE DEFAULT) */
        #result-body { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }

        .score-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Info Bar di atas kartu */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
        }

        .badge-info {
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--primary);
        }

        .court-label { color: var(--accent); }

        /* Tampilan Partai & Skor */
        .match-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .team-box { flex: 1; text-align: center; }

        .team-name {
            font-size: 14px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.3;
        }

        .pb-name {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .score-display {
            background: #1e3a8a;
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            min-width: 80px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        .vs-divider { font-size: 10px; font-weight: 800; color: #cbd5e1; margin-top: 4px; }

        /* Pemenang Footer */
        .card-footer {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #e2e8f0;
            text-align: center;
        }

        .winner-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--success);
        }

        .waiting-text { font-size: 11px; color: #94a3b8; font-style: italic; }

        /* Tag Kategori Melayang */
        .category-tag {
            position: absolute;
            top: 0;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            font-size: 9px;
            font-weight: 800;
            border-radius: 0 0 10px 10px;
            text-transform: uppercase;
        }

        /* Loader */
        .live-indicator {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Desktop View: Kembali ke Tabel Professional */
        @media (min-width: 992px) {
            #result-body { display: table-row-group; }
            table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; }
            th { background: var(--primary); color: white; padding: 15px; font-size: 12px; text-align: left; }
            td { padding: 15px; border-bottom: 1px solid #f1f5f9; }
            .score-card { display: table-row; background: none; box-shadow: none; border: none; }
            .category-tag, .card-header, .card-footer { display: none; }
            /* Penyesuaian konten tabel desktop di sini jika diperlukan */
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-section">
            <h2><div class="live-indicator"></div> Live Results</h2>

            <div class="filter-grid">
                <div class="filter-item">
                    <label>Tanggal</label>
                    <select id="filter-tanggal" onchange="loadLiveResults()">
                        <option value="ALL">Semua</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>Kategori</label>
                    <select id="filter-kategori" onchange="loadLiveResults()">
                        <option value="ALL">Semua</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>Lapangan</label>
                    <select id="filter-lapangan" onchange="loadLiveResults()">
                        <option value="ALL">Semua</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="result-body">
            </div>
    </div>

    <script>
        let masterData = [];

        async function initFilters() {
            try {
                const res = await fetch('/api/get-full-schedule');
                masterData = await res.json();

                const selKat = document.getElementById('filter-kategori');
                const unikKat = [...new Set(masterData.map(m => m.kategori))].sort();
                unikKat.forEach(c => selKat.add(new Option(c, c)));

                const selTgl = document.getElementById('filter-tanggal');
                const unikTgl = [...new Set(masterData.map(m => m.tanggal))].sort();
                unikTgl.forEach(t => selTgl.add(new Option(t, t)));

                const selLap = document.getElementById('filter-lapangan');
                const unikLap = [...new Set(masterData.map(m => m.court))].sort();
                unikLap.forEach(l => selLap.add(new Option(l, l)));

                loadLiveResults(false);
            } catch (err) { console.error(err); }
        }

        async function loadLiveResults(shouldFetch = true) {
            if (shouldFetch) {
                const res = await fetch('/api/get-full-schedule');
                masterData = await res.json();
            }

            const valTgl = document.getElementById('filter-tanggal').value;
            const valKat = document.getElementById('filter-kategori').value;
            const valLap = document.getElementById('filter-lapangan').value;

            const container = document.getElementById('result-body');
            
            const filteredData = masterData.filter(m => {
                return (valTgl === "ALL" || m.tanggal === valTgl) &&
                       (valKat === "ALL" || m.kategori === valKat) &&
                       (valLap === "ALL" || m.court === valLap);
            });

            if (filteredData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:50px;">Tidak ada jadwal.</p>';
                return;
            }

            container.innerHTML = '';
            filteredData.forEach(m => {
                const isSelesai = m.status_label === "SELESAI";
                
                // Pecah Nama Pemain dan PB (asumsi format: Nama (PB))
                const parsePlayer = (text) => {
                    const match = text.match(/(.*?) \((.*?)\)/);
                    return match ? { name: match[1], pb: match[2] } : { name: text, pb: '' };
                };

                const sep = m.partai.includes(' vs ') ? ' vs ' : ' VS ';
                const players = m.partai.split(sep);
                const p1 = parsePlayer(players[0] || 'TBD');
                const p2 = parsePlayer(players[1] || 'TBD');

                const card = document.createElement('div');
                card.className = 'score-card';
                card.innerHTML = `
                    <div class="category-tag">${m.kategori}</div>
                    <div class="card-header">
                        <span><i class="far fa-clock"></i> ${m.jam}</span>
                        <span class="court-label"><i class="fas fa-map-marker-alt"></i> ${m.court}</span>
                        <span class="badge-info">${m.babak || 'Partai'}</span>
                    </div>
                    <div class="match-main">
                        <div class="team-box">
                            <div class="pb-name">${p1.pb}</div>
                            <div class="team-name">${p1.name}</div>
                        </div>
                        <div style="text-align:center">
                            <div class="score-display">${m.skor || '0 - 0'}</div>
                            <div class="vs-divider">VS</div>
                        </div>
                        <div class="team-box">
                            <div class="pb-name">${p2.pb}</div>
                            <div class="team-name">${p2.name}</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        ${isSelesai ? 
                            `<div class="winner-text"><i class="fas fa-trophy"></i> Winner: ${m.winner}</div>` : 
                            `<div class="waiting-text">Pertandingan Belum Dimulai</div>`}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = initFilters;
        setInterval(() => loadLiveResults(true), 30000);
    </script>
</body>

</html>
