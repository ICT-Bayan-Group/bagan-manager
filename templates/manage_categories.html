<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manajemen Kategori - BPN OPEN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h2 {
            color: var(--primary);
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.5rem;
        }

        .box {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* INPUT AREA */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            background: #fff;
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-add:active {
            transform: scale(0.9);
        }

        /* CATEGORY LIST */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #f1f5f9;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        li span {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .btn-delete {
            background: #fee2e2;
            color: var(--danger);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-delete:active {
            background: var(--danger);
            color: white;
        }

        /* SAVE BUTTON */
        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
            transition: 0.2s;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
  
        <div class="box">
            <div class="input-group">
                <input type="text" id="new-category" placeholder="Contoh: Ganda Putra A...">
                <button class="btn-add" onclick="addCategory()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <ul id="category-list">
                </ul>

            <button class="btn-save" onclick="saveToServer()">
                <i class="fas fa-cloud-upload-alt"></i> Simpan Data
            </button>
        </div>

       
    </div>

    <script>
        let categories = [];

        // 1. Ambil data kategori saat ini dari server
        async function fetchCategories() {
            try {
                const res = await fetch('/get-categories');
                const data = await res.json();
                categories = data.categories || [];
                renderList();
            } catch (err) {
                console.error("Gagal mengambil data:", err);
            }
        }

        // 2. Tampilkan daftar ke layar
        function renderList() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            
            if (categories.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:13px; padding:20px;">Belum ada kategori ditambahkan.</p>';
                return;
            }

            categories.forEach((cat, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${cat}</span>
                    <button class="btn-delete" onclick="removeCategory(${index})">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                list.appendChild(li);
            });
        }

        // 3. Tambah kategori ke array (lokal)
        function addCategory() {
            const input = document.getElementById('new-category');
            const val = input.value.trim();
            if (val && !categories.includes(val)) {
                categories.push(val);
                input.value = '';
                renderList();
            } else {
                alert(val ? "Kategori sudah ada!" : "Masukkan nama kategori!");
            }
        }

        // 4. Hapus kategori dari array (lokal)
        function removeCategory(index) {
            if (confirm("Hapus kategori ini?")) {
                categories.splice(index, 1);
                renderList();
            }
        }

        // 5. Kirim data final ke server
        async function saveToServer() {
            const btn = document.querySelector('.btn-save');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            btn.style.opacity = '0.7';

            try {
                const res = await fetch('/save-categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ categories: categories })
                });
                const result = await res.json();
                alert(result.message);
            } catch (err) {
                alert("Gagal menyimpan ke server!");
            } finally {
                btn.innerHTML = originalContent;
                btn.style.opacity = '1';
            }
        }

        // Jalankan saat load
        fetchCategories();
    </script>

</body>

</html>
