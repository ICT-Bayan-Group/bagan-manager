<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction | Tournament Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 600px;
        }

        .icon-box {
            font-size: 80px;
            color: var(--primary);
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        p {
            font-size: 18px;
            color: #64748b;
            line-height: 1.6;
        }

        .progress-container {
            background: #e2e8f0;
            border-radius: 20px;
            height: 12px;
            width: 100%;
            margin: 30px 0;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            height: 100%;
            width: 75%; /* Sesuaikan tingkat progres di sini */
            border-radius: 20px;
            animation: slide 3s ease-in-out;
        }

        .footer-text {
            margin-top: 40px;
            font-size: 14px;
            color: #94a3b8;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background-color: var(--accent);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes slide {
            from { width: 0%; }
            to { width: 75%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-tools"></i>
        </div>
        <h1>Sedang Dalam Pengembangan</h1>
        <p>Fitur manajemen turnamen dan sistem bracket otomatis sedang kami siapkan untuk pengalaman yang lebih baik. Kami akan segera kembali!</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <p style="font-size: 14px; font-weight: bold;">Progres Pengembangan: 75%</p>

        <a href="/" class="btn-back">
            <i class="fas fa-arrow-left"></i> Kembali ke Beranda
        </a>

        <div class="footer-text">
            &copy; 2026 Tournament Manager - Build with <i class="fas fa-heart" style="color: #ef4444;"></i>
        </div>
    </div>

</body>
</html>
